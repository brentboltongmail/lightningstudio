<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Screen & Macro Controller</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Left: phone only -->
    <div class="viewport-panel">
      <div class="device-frame">
        <div class="device-speaker"></div>
        <div class="screen-container" id="screenWrapper">
          <img id="liveMjpeg" alt="" draggable="false" />
          <canvas id="screenCanvas" width="440" height="956"></canvas>
          <div id="touchRipple" class="touch-ripple"></div>
          <div id="swipeIndicator" class="swipe-indicator"></div>
        </div>
        <div class="home-bar"></div>
      </div>
    </div>

    <!-- Right: connection, stream, macros -->
    <aside class="sidebar-panel">
      <header class="panel-header">
        <div class="title-row">
          <h1>iOS Controller</h1>
          <span id="statusBadge" class="badge disconnected">Waiting</span>
        </div>
        <p id="deviceInfo" class="device-info">Looking for an iPhone…</p>
        <button id="linkBtn" class="btn secondary link-btn" type="button" hidden>Disconnect</button>
      </header>

      <section class="control-card">
        <div class="card-head">
          <h2>Stream</h2>
          <button id="autoStreamBtn" class="btn small">Stream: Off</button>
        </div>
        <div class="option-sliders">
          <label for="streamQuality">JPEG quality <span id="streamQualityVal">5</span>%</label>
          <input type="range" id="streamQuality" min="1" max="100" step="1" value="5" />
          <label for="streamScale">Resolution scale <span id="streamScaleVal">20</span>%</label>
          <input type="range" id="streamScale" min="10" max="100" step="5" value="20" />
        </div>
      </section>

      <section class="control-card">
        <h2>Tap merge</h2>
        <div class="option-sliders">
          <label for="tapMergeMs">Time window <span id="tapMergeMsVal">30</span> ms</label>
          <input type="range" id="tapMergeMs" min="0" max="500" step="5" value="30" />
          <label for="tapMergePx">Distance <span id="tapMergePxVal">5</span> pt</label>
          <input type="range" id="tapMergePx" min="0" max="50" step="1" value="5" />
        </div>
        <p class="option-hint">Rapid taps inside both limits count as one. Set either to 0 to disable.</p>
      </section>

      <section class="control-card">
        <h2>Macro Recorder</h2>
        <div class="btn-group">
          <button id="recordBtn" class="btn record">Record</button>
          <button id="stopBtn" class="btn stop" disabled>Stop</button>
          <button id="playBtn" class="btn play" disabled>Play</button>
          <button id="clearBtn" class="btn secondary">Clear</button>
        </div>
        <div class="loop-settings">
          <label>
            Loops
            <input type="number" id="loopCount" value="1" min="1" max="999" />
          </label>
          <label>
            Loop delay (ms)
            <input type="number" id="loopDelay" value="500" min="0" step="100" />
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="infiniteLoop" />
            Infinite
          </label>
        </div>
      </section>

      <section class="macro-list-container">
        <div class="list-header">
          <h2>Actions <span class="count">(<span id="stepCount">0</span>)</span></h2>
          <div class="list-actions">
            <button id="exportBtn" class="btn small">Export</button>
            <button id="importBtn" class="btn small">Import</button>
            <input type="file" id="fileInput" accept=".json" hidden />
          </div>
        </div>
        <div id="stepList" class="step-list">
          <div class="empty-state">No steps yet. Record, then tap or swipe on the phone.</div>
        </div>
      </section>

      <section class="log-panel">
        <h2>Log</h2>
        <div id="logOutput" class="log-output"></div>
      </section>
    </aside>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
